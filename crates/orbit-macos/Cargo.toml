[package]
name = "orbit-macos"
description = "Orbit macOS layer: AppKit UI and system adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
orbit-app.workspace = true
orbit-domain.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "std",
    "objc2-core-foundation",
    "NSButton",
    "NSControl",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
objc2-foundation = { workspace = true, features = ["std", "NSString"] }
thiserror.workspace = true
tracing.workspace = true

# Used by the stage 0 spike example and the main-thread test; the spike
# features move to [dependencies] as the real adapters are written.
[dev-dependencies]
block2.workspace = true
global-hotkey.workspace = true
objc2-app-kit = { workspace = true, features = [
    "std",
    "block2",
    "libc",
    "objc2-core-foundation",
    "NSApplication",
    "NSBezierPath",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-application-services = { workspace = true, features = [
    "std",
    "libc",
    "AXError",
    "AXUIElement",
    "HIServices",
] }
objc2-core-foundation = { workspace = true, features = [
    "std",
    "CFArray",
    "CFDate",
    "CFDictionary",
    "CFMachPort",
    "CFNumber",
    "CFRunLoop",
    "CFString",
    "CFURL",
] }
objc2-core-graphics = { workspace = true, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }
objc2-foundation = { workspace = true, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSJSONSerialization",
    "NSString",
] }
tracing-subscriber.workspace = true

[[example]]
name = "spike"
path = "examples/spike/main.rs"

[[test]]
name = "main_thread"
harness = false

[lints]
workspace = true
