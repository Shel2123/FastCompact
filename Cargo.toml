[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
orbit-domain = { path = "crates/orbit-domain" }
orbit-app = { path = "crates/orbit-app" }
orbit-runtime = { path = "crates/orbit-runtime" }
orbit-ops = { path = "crates/orbit-ops" }
orbit-macos = { path = "crates/orbit-macos" }
orbit-windows = { path = "crates/orbit-windows" }

block2 = "0.6.2"
crossbeam-channel = "0.5.17"
dispatch2 = "0.3.1"
global-hotkey = "0.9.0"
libc = "0.2.191"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-application-services = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-quartz-core = { version = "0.3.2", default-features = false }
rustix = { version = "1.1.5", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
windows = { version = "0.62.2", default-features = false }
zip = { version = "9.8.2", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
