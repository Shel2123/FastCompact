[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
orbit-domain = { path = "crates/orbit-domain" }
orbit-app = { path = "crates/orbit-app" }
orbit-macos = { path = "crates/orbit-macos" }

block2 = "0.6.2"
crossbeam-channel = "0.5.17"
dispatch2 = "0.3.1"
global-hotkey = "0.9.0"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-application-services = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
